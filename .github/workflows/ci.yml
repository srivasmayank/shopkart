name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Migrate & Concurrency Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shopkart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shop:shop@localhost:5432/shopkart_test
      JWT_SECRET: shopkart-ci-super-secret-key-2026
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Prisma migrations
        run: npx prisma migrate deploy
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Seed database
        run: npx prisma db seed
      - name: Build application
        run: npm run build
      - name: Run E2E & Concurrency Test Suite
        run: npm run test:e2e

